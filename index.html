<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./assets/icons/burger.png" type="image/x-icon" />
        <title>BurgerHouse</title>

        <link rel="stylesheet" href="./styles/standard.css" />
        <link rel="stylesheet" href="./styles/fonts.css" />
        <link rel="stylesheet" href="./styles/variables.css" />
        <link rel="stylesheet" href="./styles/header.css" />
        <link rel="stylesheet" href="./styles/footer.css" />
        <link rel="stylesheet" href="./styles/dishes.css" />
        <link rel="stylesheet" href="./styles/basket.css" />
        <link rel="stylesheet" href="./styles/dialog.css" />
        <link rel="stylesheet" href="style.css" />

        <script defer src="./scripts/db.js"></script>
        <script defer src="./scripts/templates.js"></script>
        <script defer src="script.js"></script>
    </head>
    <body onload="init()">
        <header class="main-header">
            <img class="logo" src="./assets/img/Logo.svg" alt="Takeout Logo" />
            <nav id="nav">
                <ul>
                    <li>
                        <a href="index.html"><img src="./assets/icons/home.svg" alt="Home Logo" /></a>
                    </li>
                    <li>
                        <img src="./assets/icons/person.svg" alt="Personal Account" />
                    </li>
                    <li>
                        <img src="./assets/icons/takeout.svg" alt="Takeout Logo" />
                    </li>
                    <li id="cart-icon"></li>
                </ul>
                <img src="./assets/img/nav.svg" alt="Menu Logo" />
            </nav>
        </header>
        <main class="main-content">
            <!-- #region hero section -->
            <section class="hero-section">
                <div class="hero-img-div">
                    <img class="hero" src="./assets/img/hero.jpg" alt="table full of fast food" />
                </div>
                <div class="overlay">
                    <img src="./assets/icons/overlay.png" alt="picture of a burger" />
                </div>
                <div class="hero-txt-div">
                    <div class="hero-txt">
                        <h1><span class="text-orange">Burger</span><span class="text-dark">House</span></h1>
                        <div class="rating">
                            <img src="./assets/icons/star.svg" alt="rating-star" />
                            <p id="rating">4,1</p>
                            <p>(317)</p>
                        </div>
                    </div>
                    <p class="slogan">The best of Burgers, Pizza, and Greens, all in one great place.</p>
                </div>
            </section>
            <!-- #endregion hero section  -->
            <section class="dish-wrapper">
                <section class="category burger-section">
                    <div class="category-wrapper">
                        <img src="./assets/icons/burger.png" alt="burger image" />
                        <h2>
                            <span>Burger</span>
                            <span class="sandwiches"> & Sandwiches</span>
                        </h2>
                    </div>
                    <div class="orange-bar"></div>
                </section>
                <section class="dishes" id="burger-container"></section>
                <section class="category pizza-section">
                    <div class="category-wrapper">
                        <img src="./assets/icons/pizza.png" alt="pizza image" />
                        <h2>Pizza</h2>
                    </div>
                    <div class="orange-bar"></div>
                </section>
                <section class="dishes" id="pizza-container"></section>
                <section class="category salad-section">
                    <div class="category-wrapper">
                        <img src="./assets/icons/salad.png" alt="salad image" />
                        <h2>Salad</h2>
                    </div>
                    <div class="orange-bar"></div>
                </section>
                <section class="dishes" id="salad-container"></section>
                <section class="category milkshake-section">
                    <div class="category-wrapper">
                        <img src="./assets/icons/milkshakes.svg" alt="milkshake image" />
                        <h2>Milkshakes</h2>
                    </div>
                    <div class="orange-bar"></div>
                </section>
                <section class="dishes" id="milkshake-container"></section>
                <section class="category dessert-section">
                    <div class="category-wrapper">
                        <img src="./assets/icons/desserts.svg" alt="dessert image" />
                        <h2>Desserts</h2>
                    </div>
                    <div class="orange-bar"></div>
                </section>
                <section class="dishes" id="dessert-container"></section>
                <section id="cart-wrapper" class="cart-wrapper"></section>
            </section>
            <dialog id="confirmation" class="order-confirmed"></dialog>
        </main>
        <footer>
            <p><strong>©</strong> 2026 BurgerHouse</p>
            <a href="./pages/imprint.html">Imprint</a>
            <p>Cookie Preferences</p>
        </footer>
    </body>
</html>
